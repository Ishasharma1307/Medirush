services:
  # ─── 1. FRONTEND: React Vite App (Static Site) ─────────────────────────────────
  - type: web
    name: medirush-web
    env: static
    rootDir: medirush-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false

  # ─── 2. BACKEND: Express Node.js Server (Web Service) ──────────────────────────
  - type: web
    name: medirush-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
